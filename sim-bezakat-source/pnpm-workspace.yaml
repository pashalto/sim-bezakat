# Avoid symlink privileges on Windows and keep package storage project-local.
nodeLinker: hoisted
storeDir: .pnpm-store

# Keep host-native binaries for builds and Linux ARM64 binaries for Lambda.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - arm64
  libc:
    - current
    - glibc
